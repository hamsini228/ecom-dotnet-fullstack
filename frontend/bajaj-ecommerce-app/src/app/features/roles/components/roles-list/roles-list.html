<h2>Roles List</h2>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>Role ID</th>
      <th>Role Name</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    @for(role of roles|async; track role.roleId){
      <tr>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
      </tr>
    }
  </tbody>
</table>
